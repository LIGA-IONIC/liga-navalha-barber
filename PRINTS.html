<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Print · Navalha Barber</title>
<link rel="stylesheet" href="prints.css">
<style>
body{background:#fff;padding:16px 12px 32px}
.exemplo{text-align:center;font-size:0.72rem;letter-spacing:0.16em;font-weight:800;color:#94a3b8;margin:0 0 12px}
.bloco h2{display:none}
.fone{box-shadow:none;border:0;border-radius:12px;min-height:0}
.tb{background:#171717}
.btn.main{background:#ca8a04;color:#111}
</style>
</head>
<body>
<p class="exemplo">EXEMPLO VISUAL</p>
<div class="grid">
  <div class="bloco">
    <div class="fone">
      <div class="tb"><span>Navalha</span><span style="font-weight:600;font-size:0.8rem;">sair</span></div>
      <div class="pad">
        <div class="item"><div><strong>Corte degradê</strong></div><div class="preco">R$ 45</div></div>
        <div class="item"><div><strong>Barba</strong></div><div class="preco">R$ 30</div></div>
        <div class="item"><div><strong>Corte + barba</strong><div class="muted">combo</div></div><div class="preco">R$ 65</div></div>
        <div class="item"><div><strong>Sobrancelha</strong></div><div class="preco">R$ 15</div></div>
        <div class="item"><div><strong>Pigmentação</strong><div><span class="badge bad">esgotado</span></div></div><div class="preco">R$ 80</div></div>
      </div>
    </div>
  </div>
  <div class="bloco">
    <div class="fone">
      <div class="tb"><span>Comanda</span><span style="font-weight:600;font-size:0.8rem;">voltar</span></div>
      <div class="pad">
        <div class="item">
        <div>
        <strong>Corte degradê</strong>
        </div>
        <div class="preco">
        <span style="text-decoration:line-through;color:#94a3b8;font-weight:500;margin-right:6px;">R$ 45</span>
        </div>
        </div>
        <div class="item">
        <div>
        <strong>Barba</strong>
        </div>
        <div class="preco">
        <span style="text-decoration:line-through;color:#94a3b8;font-weight:500;margin-right:6px;">R$ 30</span>
        </div>
        </div>
        <div class="aviso info">Combo: R$ 10 off</div>
        <div class="total">
          <div class="linha"><span>Cheio</span><span>R$ 75,00</span></div>
          <div class="linha g"><span>Total</span><span>R$ 65,00</span></div>
        </div>
        <button class="btn main">Fechar comanda</button>
      </div>
    </div>
  </div>
</div>
</body>
</html>
